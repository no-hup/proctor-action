name: 'agent-proctor'
description: 'Prove PR tests catch bugs on base and keep existing test contracts intact — zero-egress, deterministic'
author: 'The Proctor Team'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base-ref:
    description: 'Base git commit SHA or branch to compare against'
    required: false
    default: ${{ github.event.pull_request.base.sha || github.base_ref || 'origin/main' }}
  head-ref:
    description: 'Head git commit SHA or branch'
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha || 'HEAD' }}
  enforce:
    description: 'Enforce blocking exit code (false = Observe Mode: reports findings to step summary but exits 0)'
    required: false
    default: 'false'
  strict:
    description: 'Treat Report findings as hard BLOCK (exit 1) for autonomous agent PRs'
    required: false
    default: 'false'
  experimental-probe:
    description: 'Run ephemeral mutation probe in an isolated git worktree'
    required: false
    default: 'false'
  verify:
    description: 'Experimental: run dynamic red/green verification (run after npm ci / pip install; refused on pull_request_target)'
    required: false
    default: 'false'
  sarif-file:
    description: 'File path to write SARIF 2.1.0 output'
    required: false
    default: 'proctor-results.sarif'
  github-token:
    description: 'GitHub token for reviewer waiver verification'
    required: false
    default: ${{ github.token }}
  version:
    description: 'agent-proctor release version to download'
    required: false
    default: 'v0.2.2'

runs:
  using: 'composite'
  steps:
    - name: Fetch PR commit objects
      shell: bash
      run: |
        if [ -n "${{ inputs.base-ref }}" ] && [ "${{ inputs.base-ref }}" != "origin/main" ]; then
          git fetch --depth=1 origin "${{ inputs.base-ref }}" || true
        fi
        if [ -n "${{ inputs.head-ref }}" ] && [ "${{ inputs.head-ref }}" != "HEAD" ]; then
          git fetch --depth=1 origin "${{ inputs.head-ref }}" || true
        fi

    - name: Verify GitHub-attested reviewer waivers & acks
      id: waivers
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -n "$PR_NUMBER" ]; then
          # Extract review_mode strictly from base policy to prevent PR tampering
          REVIEW_MODE="ack"
          if git cat-file -e "${{ inputs.base-ref }}:proctor.toml" 2>/dev/null; then
            MODE_EXTRACT=$(git show "${{ inputs.base-ref }}:proctor.toml" | grep -E '^review_mode\s*=' | sed -E 's/review_mode\s*=\s*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
            if [ -n "$MODE_EXTRACT" ]; then
              REVIEW_MODE="$MODE_EXTRACT"
            fi
          elif git cat-file -e "${{ inputs.base-ref }}:.proctor.toml" 2>/dev/null; then
            MODE_EXTRACT=$(git show "${{ inputs.base-ref }}:.proctor.toml" | grep -E '^review_mode\s*=' | sed -E 's/review_mode\s*=\s*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
            if [ -n "$MODE_EXTRACT" ]; then
              REVIEW_MODE="$MODE_EXTRACT"
            fi
          fi
          export PROCTOR_REVIEW_MODE="$REVIEW_MODE"

          WAIVERS=$(python3 ${{ github.action_path }}/scripts/fetch_waivers.py)
          echo "verified_waivers=$WAIVERS" >> $GITHUB_OUTPUT
          if [ -n "$WAIVERS" ]; then
            echo "proctor: Active attested reviewer waivers: $WAIVERS"
          fi
        else
          echo "verified_waivers=" >> $GITHUB_OUTPUT
        fi

    - name: Install agent-proctor release binary
      shell: bash
      run: |
        if command -v proctor &> /dev/null; then
          exit 0
        fi
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        if [ "$ARCH" = "x86_64" ]; then
          TARGET="x86_64"
        elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
          TARGET="aarch64"
        else
          TARGET="x86_64"
        fi

        # Download precompiled binary from public release asset
        URL="https://github.com/no-hup/agent-proctor/releases/download/${{ inputs.version }}/proctor-${OS}-${TARGET}.tar.gz"
        mkdir -p /tmp/proctor-bin
        if curl -sLf "$URL" -o /tmp/proctor.tar.gz; then
          tar -xzf /tmp/proctor.tar.gz -C /tmp/proctor-bin
          chmod +x /tmp/proctor-bin/proctor
          echo "/tmp/proctor-bin" >> $GITHUB_PATH
          echo "proctor: Downloaded precompiled binary from $URL"
        else
          echo "::error::agent-proctor precompiled release binary could not be downloaded from $URL. Please verify inputs.version ('${{ inputs.version }}') or ensure a release asset exists for $OS-$TARGET."
          exit 1
        fi

    - name: Run agent-proctor scan
      shell: bash
      env:
        PROCTOR_VERIFIED_WAIVERS: ${{ steps.waivers.outputs.verified_waivers }}
      run: |
        ARGS="--base ${{ inputs.base-ref }} --head ${{ inputs.head-ref }} --sarif ${{ inputs.sarif-file }}"
        
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS="$ARGS --strict"
        fi
        
        if [ "${{ inputs.experimental-probe }}" = "true" ]; then
          ARGS="$ARGS --experimental-probe"
        fi

        if [ "${{ inputs.verify }}" = "true" ]; then
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "::warning::agent-proctor refused verify=true under pull_request_target to prevent running untrusted PR code with repository secrets."
          else
            ARGS="$ARGS --verify"
          fi
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          ARGS="$ARGS --receipt $GITHUB_STEP_SUMMARY"
        fi

        EXIT_CODE=0
        proctor scan $ARGS || EXIT_CODE=$?

        # Emit concise GitHub workflow annotations + headline banner under read-only perms
        python3 - "${{ inputs.sarif-file }}" "${GITHUB_STEP_SUMMARY:-}" "$EXIT_CODE" << 'PYEOF'
import json, os, sys

sarif_path, summary_path, exit_code = sys.argv[1], sys.argv[2], int(sys.argv[3])
guard_count = 0
report_count = 0

if os.path.exists(sarif_path):
    try:
        with open(sarif_path) as f:
            sarif = json.load(f)
        results = (sarif.get("runs") or [{}])[0].get("results", [])
        for r in results:
            lvl = r.get("level", "warning")
            if lvl == "error":
                guard_count += 1
            elif lvl == "warning":
                report_count += 1

        # Emit up to 10 file-level annotations so GitHub UI never drops them silently
        for r in results[:10]:
            lvl = "error" if r.get("level") == "error" else "warning"
            rule = r.get("ruleId", "PROCTOR")
            msg = (r.get("message") or {}).get("text", "").replace("\n", " ")
            loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
            uri = (loc.get("artifactLocation") or {}).get("uri", "")
            line = (loc.get("region") or {}).get("startLine")
            meta = f"file={uri}" if uri else ""
            if meta and line:
                meta += f",line={line}"
            prefix = f"::{lvl} {meta}::" if meta else f"::{lvl}::"
            print(f"{prefix}[{rule}] {msg}")
    except Exception as exc:
        print(f"::warning title=proctor: SARIF parse warning::{exc}")

verify_note = ""
if summary_path and os.path.exists(summary_path):
    try:
        txt = open(summary_path).read()
        if "Dynamic Test Verification Receipt" in txt:
            catches = txt.count("| 🛡️ **Catches change** |")
            passes_both = txt.count("| ⚪ **Passes on both** |")
            broken = txt.count("| ❌ **Broken** |")
            if any((catches, passes_both, broken)):
                verify_note = f" | verify: {catches} catches change, {passes_both} passes on both, {broken} broken"
    except Exception:
        pass

if guard_count == 0 and report_count == 0 and exit_code == 0:
    print(f"::notice title=proctor: Clean test diff{verify_note}::No test tampering or assertion loosening detected.")
else:
    print(f"::warning title=proctor: {guard_count} guard, {report_count} review{verify_note}::Inspect Test-Change Receipt in Job Summary or SARIF.")
PYEOF

        if [ "${{ inputs.enforce }}" = "true" ]; then
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::agent-proctor policy violation detected (exit code $EXIT_CODE). PR blocked."
            exit $EXIT_CODE
          fi
        else
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::agent-proctor detected violations (exit code $EXIT_CODE). Running in Observe Mode (enforce=false), so CI continues without blocking."
          fi
          exit 0
        fi
