name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-clean:
    name: Test Clean PR (enforce=true -> PASS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create baseline commit
        run: |
          git checkout -b fixture-base
          mkdir -p tests
          cat << 'EOF' > tests/test_calc.py
          def test_addition():
              assert 1 + 1 == 2
          EOF
          git add tests/test_calc.py
          git commit -m "chore: add test baseline"

      - name: Create clean feature commit
        run: |
          git checkout -b fixture-clean
          cat << 'EOF' >> tests/test_calc.py

          def test_subtraction():
              assert 2 - 1 == 1
          EOF
          git add tests/test_calc.py
          git commit -m "feat: add subtraction test"

      - name: Run agent-proctor action (clean, enforce=true)
        id: run_clean
        uses: ./
        with:
          base-ref: fixture-base
          head-ref: fixture-clean
          enforce: 'true'
          sarif-file: clean-results.sarif

      - name: Verify clean results
        run: |
          if [ ! -f clean-results.sarif ]; then
            echo "Error: clean-results.sarif was not created!"
            exit 1
          fi
          echo "Clean SARIF created successfully."

  test-observe-mode:
    name: Test Observe Mode (cheat detected, enforce=false -> exits 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create baseline commit
        run: |
          git checkout -b fixture-base-obs
          mkdir -p tests
          cat << 'EOF' > tests/test_calc.py
          def test_addition():
              assert 1 + 1 == 2
          EOF
          git add tests/test_calc.py
          git commit -m "chore: add test baseline"

      - name: Create cheated commit
        run: |
          git checkout -b fixture-cheat-obs
          cat << 'EOF' > tests/test_calc.py
          def test_addition():
              assert True
          EOF
          git add tests/test_calc.py
          git commit -m "cheat: weaken assertion"

      - name: Run agent-proctor action in Observe Mode (enforce=false)
        id: run_observe
        uses: ./
        with:
          base-ref: fixture-base-obs
          head-ref: fixture-cheat-obs
          enforce: 'false'
          sarif-file: observe-results.sarif

      - name: Verify Observe Mode exited 0 and recorded findings in SARIF
        run: |
          if [ ! -f observe-results.sarif ]; then
            echo "Error: observe-results.sarif was not created!"
            exit 1
          fi
          if ! grep -q "PROCTOR-001" observe-results.sarif; then
            echo "Error: PROCTOR-001 finding not found in observe SARIF!"
            exit 1
          fi
          echo "Observe Mode successfully passed CI while reporting PROCTOR-001."

  test-enforce-mode:
    name: Test Enforce Mode (cheat detected, enforce=true -> BLOCKED exit 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create baseline commit
        run: |
          git checkout -b fixture-base-enf
          mkdir -p tests
          cat << 'EOF' > tests/test_calc.py
          def test_addition():
              assert 1 + 1 == 2
          EOF
          git add tests/test_calc.py
          git commit -m "chore: add test baseline"

      - name: Create cheated commit
        run: |
          git checkout -b fixture-cheat-enf
          cat << 'EOF' > tests/test_calc.py
          def test_addition():
              assert True
          EOF
          git add tests/test_calc.py
          git commit -m "cheat: weaken assertion"

      - name: Run agent-proctor action in Enforce Mode (enforce=true)
        id: run_enforce
        continue-on-error: true
        uses: ./
        with:
          base-ref: fixture-base-enf
          head-ref: fixture-cheat-enf
          enforce: 'true'
          sarif-file: enforce-results.sarif

      - name: Verify Enforce Mode blocked the cheated PR
        run: |
          if [ "${{ steps.run_enforce.outcome }}" != "failure" ]; then
            echo "Error: Expected proctor to fail on cheated commit when enforce=true, but outcome was ${{ steps.run_enforce.outcome }}"
            exit 1
          fi
          echo "Enforce Mode successfully blocked the PR (outcome=failure)."

  test-verify-mode:
    name: Test Dynamic Verify Mode (verify=true -> Catches change)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and pytest
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create buggy base commit
        run: |
          git checkout -b fixture-base-ver
          mkdir -p app tests
          touch app/__init__.py
          cat << 'EOF' > app/math_mod.py
          def add(a, b):
              return a - b
          EOF
          git add app
          git commit -m "chore: buggy base"

      - name: Create fix + test commit
        run: |
          git checkout -b fixture-head-ver
          cat << 'EOF' > app/math_mod.py
          def add(a, b):
              return a + b
          EOF
          cat << 'EOF' > tests/test_math_mod.py
          from app.math_mod import add

          def test_add():
              assert add(2, 3) == 5
          EOF
          git add app tests
          git commit -m "fix: add numbers"

      - name: Run agent-proctor with verify=true
        uses: ./
        with:
          base-ref: fixture-base-ver
          head-ref: fixture-head-ver
          verify: 'true'
          enforce: 'true'
          sarif-file: verify-results.sarif

      - name: Verify dynamic receipt contains Catches change
        run: |
          cat "$GITHUB_STEP_SUMMARY"
          if ! grep -q "Catches change" "$GITHUB_STEP_SUMMARY"; then
            echo "Error: Expected Dynamic Test Verification Receipt to contain 'Catches change'!"
            exit 1
          fi
          echo "Verify Mode succeeded cleanly."
